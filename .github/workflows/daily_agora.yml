name: Daily Synthetic Agora Cycle

on:
  schedule:
    # Run every night at 4:23 AM UTC (off-peak minute to avoid GitHub scheduler queue delays)
    - cron: '23 4 * * *'
  workflow_dispatch:
    # Allow manual execution via the GitHub Actions tab

permissions:
  contents: write

jobs:
  agora_cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Configure Git SSL verification
      run: git config --global http.sslVerify false

    - name: Checkout repository
      uses: actions/checkout@v4
      env:
        GIT_SSL_NO_VERIFY: "true"
      with:
        fetch-depth: 0

    - name: Checkout World C
      uses: actions/checkout@v4
      with:
        repository: 'nini1972/world_c'
        path: 'world_c'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ -f world_c/requirements.txt ]; then
          pip install -r world_c/requirements.txt
        fi

    - name: Sync Embassy (pull Frontier dossiers from Evolution Sandbox)
      run: |
        python embassy_bridge.py

    - name: Pre-warm Sovereign Runpod vLLM Worker
      continue-on-error: true
      env:
        RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      run: |
        python -c "
        import os, urllib.request, json
        api_key = os.getenv('RUNPOD_API_KEY')
        endpoint_id = 'nxrwj2zma759vc'
        if api_key:
            print('[Pre-warm] Waking up sovereign InvariantMind worker on Runpod in background...')
            url = f'https://api.runpod.ai/v2/{endpoint_id}/run'
            payload = json.dumps({'input': {'model': 'Ninitje/InvariantMind-Worker-7B-Merged', 'messages': [{'role': 'user', 'content': 'warmup'}], 'max_tokens': 1}}).encode('utf-8')
            req = urllib.request.Request(url, data=payload, headers={'Authorization': f'Bearer {api_key}', 'Content-Type': 'application/json'})
            try:
                with urllib.request.urlopen(req, timeout=10) as resp:
                    print(f'[Pre-warm] Queued async warmup job: status {resp.status}')
            except Exception as e:
                print(f'[Pre-warm] Note: {e}')
        else:
            print('[Pre-warm] No RUNPOD_API_KEY configured, skipping warmup.')
        "

    - name: Run Synthetic Agora Multi-Agent Cycle
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        PYTHONUNBUFFERED: "1"
      run: |
        # Calculate if today is a deep-run day (every 3rd day)
        EPOCH_DAYS=$(( $(date +%s) / 86400 ))
        if [ $(( EPOCH_DAYS % 3 )) -eq 0 ]; then
          TICKS=12
          echo "🏛️ Deep Dialectic Day! Running 12 ticks per model."
        else
          TICKS=5
          echo "🏛️ Daily Agora Pulse! Running 5 ticks per model."
        fi
        
        python run_agora.py --instances gemini_3_7_flash,claude_sonnet,llama_70b,kimi_code,minimax_m3,deepseek_v4_flash,qwen_2_5_coder,glm_5_2,tencent_hy3,poolside_laguna,xiaomi_mimo,nvidia_nemotron,mistral_large,invariant_mind --ticks $TICKS
        
        # Automatically compile the latest edition of the Codex Book
        python compile_codex.py

    - name: Execute World C Compute Queue
      continue-on-error: true
      run: |
        python -c "
        import sys, os
        world_c_path = os.path.abspath('world_c')
        if os.path.exists(world_c_path):
            sys.path.insert(0, world_c_path)
            from embassy.bridge import EmbassyBridge
            bridge = EmbassyBridge(world_b_root=os.path.abspath('.'), world_c_root=world_c_path)
            results = bridge.scan_and_process_inbox(auto_execute=True, async_mode=False)
            reconciled = bridge.reconcile_active_jobs(timeout=60.0)
            print(f'[CI] World C executed {len(results)} pending jobs, reconciled {len(reconciled)} async jobs from Agora successfully.')
        else:
            print('[CI] World C path not found, skipping compute queue execution.')
        "

    - name: Commit and push Agora updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Remove any nested .git folders created by agents to prevent invalid submodules (gitlinks)
        find instances/ -mindepth 2 -name ".git" -type d -prune -exec rm -rf {} + 2>/dev/null || true

        # Remove any Windows-incompatible reserved files (e.g. 'nul' from 2>nul redirections)
        find instances/ -name "nul" -delete 2>/dev/null || true
        find instances/ -name "NUL" -delete 2>/dev/null || true
        rm -f nul NUL 2>/dev/null || true

        # Add all DAG nodes, artifacts, dispatches, logs, and compiled Codex
        git add instances/ CODEX_AGORA.md
        
        # Only commit and push if there are changes
        if ! git diff --cached --quiet; then
          git commit -m "chore(agora): nightly epistemic cycle - $(date +'%Y-%m-%d %H:%M:%S')"
          git pull --rebase origin main
          git push origin main
        else
          echo "No changes in Agora state to commit."
        fi
