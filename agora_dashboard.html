  <style>
    :root {
      --bg-base: #0a0d14;
      --bg-surface: #111724;
      --bg-elevated: #182234;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(56, 189, 248, 0.4);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-indigo: #6366f1;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Background Ambient Glows */
    .ambient-glow {
      position: fixed;
      top: -200px;
      left: 20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, rgba(10, 13, 20, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 10;
      padding: 24px 40px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(17, 23, 36, 0.7);
      backdrop-filter: blur(16px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #000;
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-text p {
      font-size: 12px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
    }

    .header-stats {
      display: flex;
      gap: 20px;
    }

    .stat-pill {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
    }

    .stat-value {
      font-family: var(--font-mono);
      color: var(--accent-cyan);
      font-weight: 700;
    }

    .main-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 340px 1fr 380px;
      gap: 24px;
      padding: 24px 40px;
      flex: 1;
      max-width: 1920px;
      margin: 0 auto;
      width: 100%;
    }

    .glass-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .card-header h2 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Left Panel: Guilds & Lineages */
    .guild-item {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }

    .guild-item:hover {
      border-color: var(--border-focus);
      transform: translateY(-2px);
    }

    .guild-name {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
      color: var(--accent-cyan);
    }

    .guild-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .guild-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-badge {
      background: rgba(255, 255, 255, 0.05);
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-secondary);
    }

    /* Center: Living Epistemic DAG Canvas */
    .dag-container {
      position: relative;
      flex: 1;
      min-height: 520px;
      background: #080b11;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      overflow: hidden;
    }

    #dag-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .canvas-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(17, 23, 36, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
    }

    /* Right Panel: Nodes & Verifications */
    .node-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      max-height: 700px;
      padding-right: 4px;
    }

    .node-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .node-card:hover {
      border-color: var(--border-focus);
    }

    .node-card.verified {
      border-left: 4px solid var(--accent-emerald);
    }

    .node-card.under_review {
      border-left: 4px solid var(--accent-amber);
    }

    .node-card.hypothesis {
      border-left: 4px solid var(--accent-cyan);
    }

    .node-card.refuted {
      border-left: 4px solid var(--accent-rose);
    }

    .node-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .node-id {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .node-status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    .badge-verified {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-under_review {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-amber);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-hypothesis {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .node-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .node-summary {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .node-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .quorum-meter {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 11px;
    }

    .quorum-badges {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .lineage-chip {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    /* Modal / Details Popup */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-dialog {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      width: 90%;
      max-width: 680px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .close-btn {
      float: right;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>

    function renderDashboard() {
      const nodes = Object.values(graphData.nodes || {});

      // Dynamically Render Autonomous Guilds based on active instances in the Commonwealth
      const guildsContainer = document.getElementById("guilds-container");
      if (guildsContainer) {
        guildsContainer.innerHTML = "";
        
        // Find all active instances that participated as authors or verifiers
        const activeInstances = new Set();
        nodes.forEach(n => {
          if (n.author_instance) activeInstances.add(n.author_instance);
          (n.verifications || []).forEach(v => {
            if (v.verifier_instance) activeInstances.add(v.verifier_instance);
          });
        });

        GUILDS_REGISTRY.forEach(guild => {
          // Identify members who are currently active in this run and match the guild
          const members = new Set();
          guild.core_members.forEach(m => {
            if (activeInstances.has(m)) members.add(m);
          });
          activeInstances.forEach(inst => {
            if (guild.matches(inst, nodes)) members.add(inst);
          });

          const memberArray = Array.from(members);
          
          const guildDiv = document.createElement("div");
          guildDiv.className = "guild-item";
          const tagsHtml = memberArray.length > 0
            ? memberArray.map(m => '<span class="tag-badge">' + (MODEL_DISPLAY_NAMES[m] || m) + '</span>').join("")

            <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
              <span>Quorum Reviews: <strong>${verifCount}</strong></span>
              <span>Lineages: <strong>${families.length}</strong></span>
            </div>
            <div class="quorum-badges">
              ${families.map(f => `<span class="lineage-chip">${f.toUpperCase()}</span>`).join("")}

      document.getElementById("modal-backdrop").style.display = "none";

    // Force-Directed / Layout Canvas Visualizer
    function drawDAG(nodes) {
      const canvas = document.getElementById("dag-canvas");
      const ctx = canvas.getContext("2d");
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      const w = rect.width;
      const h = rect.height;

      ctx.clearRect(0, 0, w, h);

      if (nodes.length === 0) return;

      // Position nodes in a neat radial / layered graph
      const positions = {};
      const count = nodes.length;
      nodes.forEach((node, i) => {
        const angle = (i / count) * 2 * Math.PI - Math.PI / 2;
        const radius = Math.min(w, h) * 0.32;
        positions[node.id] = {
          x: w / 2 + Math.cos(angle) * radius,
          y: h / 2 + Math.sin(angle) * radius,
          node: node
        };
      });

      // Draw Edges
      nodes.forEach(node => {
        const targetPos = positions[node.id];
        (node.parents || []).forEach(parentId => {
          const srcPos = positions[parentId];
          if (srcPos && targetPos) {
            ctx.beginPath();
            ctx.moveTo(srcPos.x, srcPos.y);
            ctx.lineTo(targetPos.x, targetPos.y);
            ctx.strokeStyle = "rgba(56, 189, 248, 0.25)";
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        });
      });

      // Draw Nodes
      Object.values(positions).forEach(p => {
        const n = p.node;
        let color = "#38bdf8";
        if (n.status === "CANON_VERIFIED") color = "#10b981";
        else if (n.status === "UNDER_REVIEW") color = "#f59e0b";
        else if (n.status === "REFUTED") color = "#f43f5e";

        // Outer pulse ring for canon verified
        if (n.status === "CANON_VERIFIED") {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 22, 0, 2 * Math.PI);
          ctx.fillStyle = "rgba(16, 185, 129, 0.15)";
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, 14, 0, 2 * Math.PI);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Node ID label
        ctx.fillStyle = "#f1f5f9";
        ctx.font = "10px JetBrains Mono";
        ctx.textAlign = "center";
        ctx.fillText(n.id, p.x, p.y + 26);
      });
    }
